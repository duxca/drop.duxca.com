name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # duxca is Debian (glibc 2.36) while the usual build hosts are newer,
      # so the deployable binary must be statically linked against musl.
      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Check the binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/drop
          ldd target/x86_64-unknown-linux-musl/release/drop 2>&1 | grep -q "statically linked"
      - uses: actions/upload-artifact@v4
        with:
          name: drop-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/drop
          if-no-files-found: error
