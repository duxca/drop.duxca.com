[package]
name = "drop"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.85"
description = "Single-use, in-memory dead drop for short texts (drop.duxca.com)"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "json"] }
base64 = "0.22"
dotenvy = "0.15"
envy = "0.4"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
