# drop.duxca.com の nginx vhost（汎用サンプル）。
# 証明書パスと中継先ポートはプレースホルダ。環境に合わせて置き換える。
#
# 方針:
# - 中継するのは drop の公開ポート（DROP_PUBLIC_ADDR）だけ。admin ポートは中継しない。/admin も塞ぐ。
# - ボディ上限をここでも掛ける（drop 側も 16 KiB で強制している）。
# - ボディをディスクの一時ファイルに書かせない（client_body_buffer_size = client_max_body_size）。
# - アクセスログはメソッド・パス・ステータスまで。クエリ・ボディ・Referer・User-Agent は残さない。
#   パスにはトークンが含まれる。それも残したくなければ access_log off にする。
#   error_log（413 などのとき）にはリクエスト行（パスとクエリ）が出るが、ボディは出ない。

# http コンテキストに置く（sites-enabled などから include される位置ならそのままでよい）
log_format drop_path '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name drop.duxca.com;
    access_log /var/log/nginx/drop.access.log drop_path;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name drop.duxca.com;

    ssl_certificate     /etc/ssl/certs/drop.example.crt;    # placeholder
    ssl_certificate_key /etc/ssl/private/drop.example.key;  # placeholder

    access_log /var/log/nginx/drop.access.log drop_path;

    client_max_body_size 16k;
    client_body_buffer_size 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # admin は公開ポート側に存在しないが、そもそも中継しない。
    # トークンは '/' を含まないので、この 2 つがトークンの URL に当たることはない。
    location = /admin {
        return 404;
    }
    location ^~ /admin/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8470;  # drop の DROP_PUBLIC_ADDR
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
